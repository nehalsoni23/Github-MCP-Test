<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and elegant Todo application">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Todo List</h1>
        <form class="input-section" onsubmit="todoApp.addTask(event)">
            <input type="text" id="taskInput" placeholder="Enter a new task" aria-label="New task input">
            <button type="submit">Add Task</button>
        </form>
        <ul id="taskList" aria-label="Todo list">
            <!-- Tasks will be added here dynamically -->
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
